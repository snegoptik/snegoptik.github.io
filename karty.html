<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe6" />
  <title>Сохранённые карты — Лунная нить</title>
  <link rel="icon" href="favicon.svg?v=2" />
  <style>html,body{background:#110f0d;color:#fbf6ee}</style>
  <link rel="stylesheet" href="css/site.css?v=30" />
</head>
<body>
  <header class="topbar sans">
    <a class="logo" href="index.html">Лунная нить</a>
    <nav class="top-nav">
      <a href="index.html">Карта</a>
      <a href="karty.html" aria-current="page">Карты</a>
    </nav>
  </header>
  <main class="wrap">
    <p class="kicker">Память</p>
    <h1>Сохранённые карты</h1>
    <p class="lead">Карты хранятся в этом браузере. Можно открыть снова, без регистрации.</p>
    <div id="list" class="chart-list"></div>
    <div class="file-row">
      <button class="btn" type="button" id="export-charts">Скачать файл</button>
      <button class="btn btn-ghost" type="button" id="import-open">Открыть файл</button>
      <input id="import-charts" type="file" accept="application/json,.json" hidden />
    </div>
    <p class="hint" id="file-note">Файл можно перенести на другой телефон и открыть здесь. На сервер он не отправляется.</p>
    <a class="btn" href="index.html">Построить новую</a>
  </main>
  <footer class="site wrap"><p><a href="index.html">На главную</a> · <a href="etika.html">Этика</a></p></footer>
  <nav class="bottom-nav">
    <a href="index.html">Карта</a>
    <a href="para.html">Пара</a>
    <a href="den.html">День</a>
    <a href="zayavka.html">Заявка</a>
  </nav>
  <script src="js/site.js?v=9"></script>
  <script>
    function render() {
      const list = Zenit.loadCharts();
      const root = document.getElementById("list");
      if (!list.length) {
        root.innerHTML = '<div class="card"><p style="margin:0">Здесь пока нет карт. Постройте карту и нажмите «Сохранить». Имя любое: Я, мама, папа.</p></div>';
        return;
      }
      root.innerHTML = list.map(function (c) {
        const q = Zenit.natalQuery(c);
        const when = Zenit.formatRuDate(c.date) + (c.time ? ", " + c.time : (Zenit.periodLabel(c.period) ? ", " + Zenit.periodLabel(c.period) : "")) + ", " + c.city;
        return '<article class="chart-item"><strong>' + c.name + "</strong><span class=\"meta\">" + when + "</span>" +
          '<div class="chart-actions">' +
          '<a href="natal.html?' + q + '">Открыть</a>' +
          '<a href="otchet.html?' + q + '">Разбор</a>' +
          '<button type="button" data-use="' + c.id + '">Текущая для «сегодня»</button>' +
          '<button type="button" data-del="' + c.id + '">Удалить</button>' +
          "</div></article>";
      }).join("");
      root.querySelectorAll("[data-del]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          Zenit.deleteChart(btn.getAttribute("data-del"));
          render();
        });
      });
      root.querySelectorAll("[data-use]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const id = btn.getAttribute("data-use");
          const row = Zenit.loadCharts().filter(function (c) { return c.id === id; })[0];
          if (!row) return;
          Zenit.saveNatal(row);
          location.href = "den.html";
        });
      });
    }
    render();

    document.getElementById("export-charts").addEventListener("click", function () {
      const note = document.getElementById("file-note");
      const payload = Zenit.exportPayload();
      if (!payload.charts.length) {
        note.textContent = "Сохранённых карт пока нет — файл был бы пустым.";
        return;
      }
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "lunnaya-nit-karty.json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
      note.textContent = "Файл скачан. Откройте его на другом телефоне на этой же странице.";
    });

    document.getElementById("import-open").addEventListener("click", function () {
      document.getElementById("import-charts").click();
    });

    document.getElementById("import-charts").addEventListener("change", function (e) {
      const file = e.target.files && e.target.files[0];
      const note = document.getElementById("file-note");
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        let payload = null;
        try { payload = JSON.parse(String(reader.result || "")); } catch (err) { payload = null; }
        const result = Zenit.importCharts(payload);
        if (!result.ok) {
          note.textContent = "Этот файл не похож на карты «Лунной нити».";
          return;
        }
        note.textContent = result.added
          ? "Добавлено карт: " + result.added + "."
          : "Эти карты уже были в списке.";
        render();
      };
      reader.readAsText(file);
      e.target.value = "";
    });
  </script>
</body>
</html>
