<head>

  <link rel="stylesheet" href="../css/site.css?v=33" />
</head>
<body>
  <header class="topbar sans">
    <a class="logo" href="../index.html">Лунная нить</a>
    <nav class="top-nav">
      <a href="../index.html">Карта</a>
      <a href="../slovar.html" aria-current="page">Словарь</a>
    </nav>
  </header>
  <main class="wrap">
    <p class="kicker">Расчёт</p>
    <h1 id="title">Планета</h1>
    <p class="lead" id="text">Сначала постройте карту, затем откройте планету из расчёта.</p>
    <p id="extra"></p>
    <p class="dict-cta"><a class="btn" href="../natal.html">К карте</a></p>
  </main>
  <footer class="site wrap">
    <p>Это не медицина, не юридический совет и не гарантия дохода.<br />
    <a href="../metod.html">Метод</a> · <a href="../etika.html">Этика</a> · <a href="../slovar.html">Словарь</a></p>
  <p><a href="../docs/index.html">Документы</a></p></footer>
  <nav class="bottom-nav">
    <a href="../index.html">Карта</a>
    <a href="../para.html">Пара</a>
    <a href="../den.html">День</a>
    <a href="../zayavka.html">Заявка</a>
  </nav>
  <script src="../js/site.js?v=9"></script>
  <script src="../js/texts.js?v=11"></script>
  <script>
    (function () {
      const RU = {
        Sun: "Солнце", Moon: "Луна", Mercury: "Меркурий", Venus: "Венера",
        Mars: "Марс", Jupiter: "Юпитер", Saturn: "Сатурн", Uranus: "Уран",
        Neptune: "Нептун", Pluto: "Плутон"
      };
      const title = document.getElementById("title");
      const text = document.getElementById("text");
      const extra = document.getElementById("extra");
      const saved = window.Zenit && Zenit.loadNatal ? Zenit.loadNatal() : null;
      const sketch = saved && saved.sketch;
      const key = (location.hash || "").replace("#", "");
      if (!sketch || !sketch.planets || !RU[key] || !sketch.planets[key]) {
        title.textContent = RU[key] || "Планета";
        text.textContent = "В сохранённой карте этой точки нет. Откройте расчёт и нажмите планету ещё раз.";
        return;
      }
      const signKey = sketch.planets[key];
      const voice = key === "Sun" ? ZENIT_TEXTS.sun[signKey] : key === "Moon" ? ZENIT_TEXTS.moon[signKey] : "";
      const line = planetLine({
        key: key,
        ru: RU[key],
        sign: { key: signKey },
        retrograde: false
      });
      title.textContent = RU[key];
      text.textContent = voice || line || (RU[key] + " в этом расчёте есть.");
      extra.textContent = voice && line ? line : "";
    })();
  </script>
</body>
</html>
